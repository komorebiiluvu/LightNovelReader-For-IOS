name: LightNovelReader
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "14.0"
  generateEmptyDirectories: true
targets:
  LightNovelReader:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LightNovelReader
        CFBundleShortVersionString: 1.0.0
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSExceptionDomains:
            img.wenku8.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIAppFonts:
          - LXGWWenKai-Regular.ttf
          - NotoSerifSC.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LightNovelReader
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.7"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LightNovelReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LightNovelReader
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LightNovelReader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LightNovelReader"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
