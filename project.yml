name: LightNovelReader
options:
  bundleIdPrefix: com.komorebiiluv
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "14.0"
  generateEmptyDirectories: true
targets:
  LightNovelReader:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - framework: Frameworks/SharedKit.xcframework
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LightNovelReader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSExceptionDomains:
            img.wenku8.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIAppFonts:
          - LXGWWenKai-Regular.ttf
          - NotoSerifSC.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komorebiiluv.LightNovelReader
        MARKETING_VERSION: "1.1.5"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.7"
        TARGETED_DEVICE_FAMILY: "1,2"
        # 真机构建时改为自动签名（在 Xcode 里选择开发者账号）；
        # 命令行/CI 无签名构建时用 CODE_SIGNING_ALLOWED=NO 覆盖
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LightNovelReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LightNovelReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LightNovelReader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LightNovelReader"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LightNovelReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: LightNovelReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LightNovelReader
